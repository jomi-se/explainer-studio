# Toolchain for the explainer studio. Node only: Chromium comes from Playwright
# (`npx playwright install chromium`) and ffmpeg from the `ffmpeg-static` npm
# package, so nothing needs apt/sudo inside the container.
[tools]
node = "22.23.1"

[env]
# ~/.cache is ephemeral in the dev container; keep the browser next to the project.
PLAYWRIGHT_BROWSERS_PATH = "{{config_root}}/.playwright"
